project:
  type: book

book:
  title: "NEPHU First Nations Population Profile"
  chapters:
    - index.qmd
    - part: "1. Introduction"
    - part: "2. Methods - Data Analysis"
    - part: "3. Methods - Consultation"
    - part: "4. Population"
      chapters: 
        - chapters/04a_population_size.qmd
        - chapters/04b_population_growth.qmd
    - part: "5. Demographics"
      chapters: 
        - chapters/05a_demographics_agesex.qmd
        - chapters/05b_demographics_language.qmd
    - part: "6. Socioeconomic Determinants of Health"
      chapters:
        - chapters/06a_socioeconomic_perinatal.qmd
        - chapters/06b_socioeconomic_childhood.qmd
        - chapters/06c_socioeconomic_education.qmd
        - chapters/06d_socioeconomic_employment.qmd
        - chapters/06e_socioeconomic_income.qmd
    - part: "7. Cultural Determinants of Health"
    - part: "8. Other Determinants of Health"
    - part: "9. Health Promoting and Risk Behaviours"
    - part: "10. Health Consequences"
    - references.qmd

bibliography: references.bib

format:
  html:
    embed-resources: false
    css: styles.css
    html-table-processing: none
    fig-align: center
    fig-cap-location: top
    grid: 
      body-width: 1000px
    number-sections: false
    anchor-sections: false
    toc: true
    toc-location: right
    toc-depth: 3
  pdf:
    documentclass: scrreprt

execute: 
  echo: false
  warning: false
  error: false
  cache: false

